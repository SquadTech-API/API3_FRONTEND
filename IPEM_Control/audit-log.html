<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Audit Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/styles/global.css"/>
  <link rel="stylesheet" href="./assets/styles/desktop-layout.css"/>
  <link rel="stylesheet" href="./assets/styles/audit-log.css"/>
</head>
<body>
<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:4px;">
      <div class="logo"><img src="./assets/logo.png" alt="IPEM" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><span style="display:none;color:#fff;font-family:var(--font-display);font-size:13px;font-weight:700;">IPEM SP</span></div>
      <nav class="nav"><ul class="menu">
        <li class="dropdown"><button class="dropdown-btn" type="button">Gerenciamento <span class="arrow">▾</span></button><ul class="submenu"><li><a href="./manage-records.html">Edição de registros</a></li><li><a href="./audit-log.html">Audit log</a></li></ul></li>
      </ul></nav>
    </div>
    <div class="nav-actions"><button class="user-chip" onclick="window.location.href='./profile.html'" type="button"><div class="user-avatar" id="header-avatar">AD</div><span id="header-user-name"></span></button></div>
    <button class="hamburger" id="hamburger" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-top" style="margin-bottom:18px;">
      <div>
        <h1 class="page-title">Audit log</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:4px;">Histórico imutável de todas as ações do sistema.</p>
      </div>
      <span style="background:var(--danger-bg);color:var(--danger-text);font-size:11px;font-weight:700;padding:5px 12px;border-radius:6px;">Somente leitura</span>
    </div>

    <div class="immutable-notice">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Registros imutáveis. Nenhuma ação pode ser editada, excluída ou alterada neste log.
    </div>

    <!-- Filtros -->
    <div class="filter-row">
      <div class="fg"><label>Usuário (matrícula)</label><input type="text" id="filter-registration" placeholder="Ex: 2"/></div>
      <div class="fg"><label>Entidade</label>
        <select id="filter-entity"><option value="">Todas</option><option>departure_log</option><option>fueling</option><option>oil_change</option><option>user</option><option>vehicle</option><option>schedule</option></select>
      </div>
      <div class="fg"><label>Ação</label>
        <select id="filter-action"><option value="">Todas</option><option>CREATE</option><option>UPDATE</option><option>DELETE</option><option>ACTIVATE</option><option>DEACTIVATE</option><option>APPROVE</option><option>REJECT</option></select>
      </div>
      <div class="fg"><label>De</label><input type="date" id="filter-from"/></div>
      <div class="fg"><label>Até</label><input type="date" id="filter-to"/></div>
      <button class="btn-filter" id="btn-apply-filter" type="button">Filtrar</button>
      <button class="btn-clear" id="btn-clear-filter" type="button">Limpar</button>
    </div>

    <div class="log-table-wrap">
      <div style="overflow-x:auto;">
        <table class="log-table">
          <thead>
            <tr>
              <th>Data/Hora</th>
              <th>Usuário</th>
              <th>Ação</th>
              <th>Entidade</th>
              <th>ID</th>
              <th>Descrição</th>
            </tr>
          </thead>
          <tbody id="log-body">
            <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted);">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="page-btn" id="btn-prev" type="button" disabled>← Anterior</button>
        <span class="page-info" id="page-info">Página 1</span>
        <button class="page-btn" id="btn-next" type="button">Próxima →</button>
      </div>
    </div>
  </div>
</main>

<script src="./assets/scripts/config.js"></script>
<script src="./assets/scripts/global.js"></script>
<script src="./assets/scripts/audit-log.js"></script>
</body>
</html>
