<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Abastecimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/styles/global.css"/>
  <link rel="stylesheet" href="./assets/styles/mobile-form.css"/>
  <link rel="stylesheet" href="./assets/styles/fueling.css"/>
</head>
<body>

<div class="page-header">
  <button class="back-btn" onclick="window.location.href='./vehicles.html'" aria-label="Voltar" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <h1 class="page-title">Novo abastecimento</h1>
  <div class="header-spacer"></div>
</div>

<div class="page-wrapper" style="padding-top:0;">

  <div class="vehicle-card">
    <div class="vehicle-card-top">
      <div class="vehicle-prefix-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <div>
          <div class="vehicle-prefix" id="vehicle-prefix">—</div>
          <div class="vehicle-model"  id="vehicle-model">—</div>
        </div>
      </div>
    </div>
    <div class="vehicle-card-bottom">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Condutor: </span>
      <strong id="conductor-name" style="color:#fff;margin-left:2px;">—</strong>
    </div>
  </div>

  <div class="form-card">

    <!-- Tipo de combustível (dinâmico via API) -->
    <div class="field-row">
      <label class="field-label" for="select-fuel-type">Combustível</label>
      <select class="field-input select-input" id="select-fuel-type">
        <option value="">Selecione</option>
      </select>
    </div>
    <div class="divider"></div>

    <!-- Datetime -->
    <div class="field-row datetime-row">
      <div class="date-group">
        <span class="dt-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </span>
        <span class="field-label-inline">Data</span>
        <input class="field-input date-input" type="date" id="input-date"/>
      </div>
      <div class="time-group">
        <span class="field-label-inline">Hora</span>
        <input class="field-input time-input" type="time" id="input-time"/>
      </div>
    </div>
    <div class="divider"></div>

    <!-- Quantidade -->
    <div class="field-row">
      <label class="field-label" for="input-liters">Quantidade (L)</label>
      <input class="field-input" type="number" id="input-liters"
        placeholder="0,000" min="0" step="0.001" inputmode="decimal"/>
    </div>
    <div class="divider"></div>

    <!-- Preço por litro -->
    <div class="field-row">
      <label class="field-label" for="input-price-per-liter">Preço/litro (R$)</label>
      <input class="field-input" type="number" id="input-price-per-liter"
        placeholder="0,00" min="0" step="0.01" inputmode="decimal"/>
    </div>

    <!-- Preview total calculado -->
    <div class="price-preview" id="price-preview" style="display:none;">
      <span>Total calculado:</span>
      <strong id="total-preview">R$ 0,00</strong>
    </div>
    <div class="divider" style="margin-top:8px;"></div>

    <!-- Valor total (editável) -->
    <div class="field-row">
      <label class="field-label" for="input-total">Valor total (R$)</label>
      <input class="field-input" type="number" id="input-total"
        placeholder="0,00" min="0" step="0.01" inputmode="decimal"/>
    </div>
    <div class="divider"></div>

    <!-- Odômetro -->
    <div class="field-row">
      <label class="field-label" for="input-mileage">Odômetro (km)</label>
      <input class="field-input" type="number" id="input-mileage"
        placeholder="0" min="0" step="1"/>
    </div>
    <div class="divider"></div>

    <!-- Nome do posto -->
    <div class="field-row">
      <label class="field-label" for="input-station">Nome do posto</label>
      <input class="field-input" type="text" id="input-station"
        placeholder="Opcional" style="text-align:left;width:155px;"/>
    </div>
    <div class="divider"></div>

    <!-- Número da NF -->
    <div class="field-row">
      <label class="field-label" for="input-invoice-number">Número da NF</label>
      <input class="field-input" type="text" id="input-invoice-number"
        placeholder="Opcional" style="text-align:left;width:155px;"/>
    </div>
    <div class="divider"></div>

    <!-- Anexar NF -->
    <div class="attach-row">
      <button class="btn-attach" onclick="document.getElementById('nf-file-input').click()" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        Anexar nota fiscal
      </button>
      <span class="attach-filename" id="attach-filename">Nenhum arquivo</span>
      <input type="file" id="nf-file-input" accept="image/*,application/pdf" style="display:none;"/>
    </div>

  </div>

  <div class="actions-row">
    <button class="btn btn-cancel" onclick="window.location.href='./vehicles.html'" type="button">Cancelar</button>
    <button class="btn btn-save" id="btn-save" type="button">Salvar abastecimento</button>
  </div>

</div>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
  <span>Salvando abastecimento...</span>
</div>

<script src="./assets/scripts/config.js"></script>
<script src="./assets/scripts/global.js"></script>
<script src="./assets/scripts/fueling.js"></script>
</body>
</html>
