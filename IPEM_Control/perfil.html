<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Meu Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles/global.css"/>
  <link rel="stylesheet" href="assets/styles/mobile-form.css"/>
  <style>
    .perfil-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 2px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: #fff; font-weight: 700;
      flex-shrink: 0;
    }
    .perfil-info { display: flex; flex-direction: column; gap: 3px; }
    .perfil-nome {
      font-family: 'Rajdhani', sans-serif; font-size: 1.15rem;
      font-weight: 700; letter-spacing: 0.03em; color: #fff;
    }
    .perfil-cargo {
      font-size: 0.78rem; color: rgba(255,255,255,0.7);
    }
    .perfil-tipo {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 3px 9px; border-radius: 20px; margin-top: 4px;
      display: inline-block;
    }
    .perfil-tipo.adm     { background: rgba(239,68,68,0.25); color: #fca5a5; border:1px solid rgba(239,68,68,0.35); }
    .perfil-tipo.tecnico { background: rgba(34,197,94,0.2);  color: #86efac; border:1px solid rgba(34,197,94,0.3); }

    .info-card {
      background: #fff; border-radius: 16px; border: 2px solid #dde3ef;
      margin: 0 16px; overflow: hidden;
      box-shadow: 0 4px 24px rgba(26,45,90,0.08);
    }
    .info-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px; gap: 10px;
    }
    .info-item + .info-item { border-top: 1px solid #eef1f8; }
    .info-label { font-size: 0.82rem; color: #6b7c9e; font-weight: 500; }
    .info-value { font-size: 0.84rem; color: #1a2d5a; font-weight: 600; text-align: right; }

    .sec-title {
      font-size: 0.78rem; font-weight: 700; color: #2253a8;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 0 16px; margin-top: 8px;
    }

    .senha-card {
      background: #fff; border-radius: 16px; border: 2px solid #dde3ef;
      margin: 0 16px; padding: 16px;
      box-shadow: 0 4px 24px rgba(26,45,90,0.08);
    }
    .senha-field { margin-bottom: 12px; }
    .senha-field label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: #2253a8; margin-bottom: 5px;
    }
    .senha-field input {
      width: 100%; border: 1.5px solid #dde3ef; border-radius: 8px;
      padding: 9px 12px; font-size: 0.84rem; color: #1a2d5a;
      background: #f7f9fc; outline: none; font-family: 'Roboto',sans-serif;
      transition: border-color 0.2s;
    }
    .senha-field input:focus { border-color: #2253a8; }
    .btn-salvar-senha {
      width: 100%; background: #1a2d5a; color: #fff;
      border: none; border-radius: 10px; padding: 13px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: 'Roboto',sans-serif; transition: opacity 0.2s;
      margin-top: 4px;
    }
    .btn-salvar-senha:hover { opacity: 0.88; }
    .btn-salvar-senha:disabled { opacity: 0.5; cursor: not-allowed; }

    .proxima-sprint-notice {
      background: #fff7ed; border: 1.5px solid #fcd34d;
      border-radius: 12px; margin: 0 16px;
      padding: 12px 16px; font-size: 13px; color: #92400e;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .proxima-sprint-notice svg { flex-shrink: 0; margin-top: 1px; }

    .logout-btn {
      margin: 4px 16px 0;
      width: calc(100% - 32px);
      background: #fee2e2; color: #dc2626;
      border: 1.5px solid #fca5a5; border-radius: 30px;
      padding: 14px; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: 'Roboto',sans-serif;
      transition: background 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .logout-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
  </style>
</head>
<body>
<div class="page-wrapper">

  <header class="page-header">
    <button class="back-btn" onclick="window.history.back()" title="Voltar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Meu perfil</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- Card de identificação -->
  <div class="vehicle-card" id="perfilHeaderCard">
    <div class="vehicle-card-top" style="gap:14px;">
      <div class="perfil-avatar" id="perfilAvatar">?</div>
      <div class="perfil-info">
        <div class="perfil-nome" id="perfilNome">—</div>
        <div class="perfil-cargo" id="perfilCargo">—</div>
        <span class="perfil-tipo" id="perfilTipo">—</span>
      </div>
    </div>
  </div>

  <!-- Informações -->
  <div class="sec-title">Informações da conta</div>
  <div class="info-card">
    <div class="info-item">
      <span class="info-label">Matrícula</span>
      <span class="info-value" id="infoMatricula">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">E-mail</span>
      <span class="info-value" id="infoEmail">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">Habilitação</span>
      <span class="info-value" id="infoHabilitacao">—</span>
    </div>
    <div class="info-item">
      <span class="info-label">Tipo de acesso</span>
      <span class="info-value" id="infoTipoAcesso">—</span>
    </div>
  </div>

  <!-- Aviso próxima sprint -->
  <div class="proxima-sprint-notice">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>A edição de informações pessoais estará disponível na próxima sprint. Por enquanto, apenas a alteração de senha está habilitada.</span>
  </div>

  <!-- Alterar senha -->
  <div class="sec-title">Alterar senha</div>
  <div class="senha-card">
    <div class="senha-field">
      <label for="senhaAtual">Senha atual</label>
      <input type="password" id="senhaAtual" placeholder="Digite sua senha atual"/>
    </div>
    <div class="senha-field">
      <label for="novaSenha">Nova senha</label>
      <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres"/>
    </div>
    <div class="senha-field" style="margin-bottom:16px;">
      <label for="confirmarSenha">Confirmar nova senha</label>
      <input type="password" id="confirmarSenha" placeholder="Repita a nova senha"/>
    </div>
    <button class="btn-salvar-senha" id="btnAlterarSenha" onclick="alterarSenha()">
      Salvar nova senha
    </button>
  </div>

  <!-- Logout -->
  <button class="logout-btn" id="btnLogout" onclick="confirmarLogout()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Sair do sistema
  </button>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><span>Aguarde...</span></div>
</div>

<script src="assets/scripts/global.js"></script>
<script src="assets/scripts/perfil.js" defer></script>
</body>
</html>
