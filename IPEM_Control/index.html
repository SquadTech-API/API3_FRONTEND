<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/styles/index.css"/>
</head>
<body>

<div class="login-wrapper">
  <div class="login-brand">
    <div class="login-logo-box">
      <span class="login-system-name">IPEM Control</span>
    </div>
    <div class="login-subtitle">Sistema de Controle de Frota — IPEM-SP</div>
  </div>

  <div class="login-card">
    <div class="login-card-title">Acesse sua conta</div>

    <div class="form-group">
      <label class="form-label" for="input-email">E-mail</label>
      <input
        id="input-email"
        class="form-input"
        type="email"
        placeholder="seu@ipem.sp.gov.br"
        autocomplete="username"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="input-password">Senha</label>
      <div class="password-wrap">
        <input
          id="input-password"
          class="form-input"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          id="btn-toggle-password"
          class="btn-toggle-pass"
          type="button"
          aria-label="Mostrar senha"
        >
          <svg id="eye-icon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button id="btn-login" class="btn-login">Entrar</button>
    <button id="btn-forgot" class="btn-forgot">Esqueceu sua senha?</button>
  </div>

  <div class="login-footer">IPEM-SP · Controle de Frota</div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div id="modal-icon" class="modal-icon error">✕</div>
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-msg" class="modal-msg"></div>
    <button id="modal-btn" class="modal-btn">OK</button>
  </div>
</div>

<script src="./assets/scripts/config.js"></script>
<script src="./assets/scripts/config.js"></script>
<script src="./assets/scripts/index.js"></script>
</body>
</html>
