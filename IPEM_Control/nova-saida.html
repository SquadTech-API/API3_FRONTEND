<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Nova Saída</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles/global.css"/>
  <link rel="stylesheet" href="assets/styles/mobile-form.css"/>
</head>
<body>
<div class="page-wrapper">

  <header class="page-header">
    <button class="back-btn" onclick="window.location.href='veiculos.html'" title="Voltar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Nova saída</h1>
    <div class="header-spacer"></div>
  </header>

  <div class="vehicle-card" id="vehicleCard">
    <div class="vehicle-card-top">
      <div class="vehicle-prefix-wrap">
        <svg class="car-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        <span class="label-prefix" id="Label_prefix_saida">Viatura —</span>
      </div>
      <span class="label-modelo badge" id="Label_modelo_saida">—</span>
    </div>
    <div class="vehicle-card-bottom">
      <span class="motorista-label">Motorista:</span>
      <span class="label-motorista" id="Label_motorista_saida">Carregando...</span>
    </div>
  </div>

  <div class="form-card">
    <div class="form-grid">

      <div class="field-row datetime-row">
        <div class="date-group">
          <span class="dt-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </span>
          <input type="date" id="Label_data_saida" class="field-input date-input"/>
        </div>
        <div class="time-group">
          <span class="field-label-inline">H:</span>
          <input type="time" id="Label_hora_saida" class="field-input time-input"/>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field-row col-left">
        <label class="field-label-text" for="Txf_km_saida">Odômetro(km):</label>
        <input type="number" id="Txf_km_saida" class="field-input" placeholder="000.000" step="0.01" min="0"/>
      </div>

      <div class="field-row col-right">
        <label class="field-label-text" for="Ddl_servico_saida">Serviço:</label>
        <select id="Ddl_servico_saida" class="field-input select-input">
          <option value="">SELECIONE</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="field-col">
        <label class="field-label-col" for="Txf_end_saida">Endereço:</label>
        <textarea id="Txf_end_saida" class="field-textarea" placeholder="Informe o endereço:" rows="3"></textarea>
      </div>

      <div class="divider"></div>

      <div class="field-col">
        <label class="field-label-col" for="Txf_cmp_saida">Complemento:</label>
        <textarea id="Txf_cmp_saida" class="field-textarea" placeholder="Digite aqui:" rows="2"></textarea>
      </div>

    </div>
  </div>

  <div class="actions-row">
    <button class="btn btn-descartar" onclick="window.location.href='veiculos.html'">Descartar</button>
    <button class="btn btn-salvar" id="Btn_salvar_saida" onclick="salvarSaida()">Salvar</button>
  </div>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><span>Salvando...</span></div>
</div>

<script src="assets/scripts/global.js"></script>
<script src="assets/scripts/nova-saida.js" defer></script>
</body>
</html>
