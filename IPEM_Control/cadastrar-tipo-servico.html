<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPEM Control — Novo Tipo de Serviço</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles/global.css"/>
  <link rel="stylesheet" href="assets/styles/mobile-form.css"/>
  <style>
    .icon-card {
      background:#1e3a7a; border-radius:16px; margin:0 16px;
      padding:16px 18px; box-shadow:0 4px 24px rgba(26,45,90,0.10);
      color:#fff; display:flex; align-items:center; gap:14px;
    }
    .icon-wrap {
      background:rgba(255,255,255,0.15); border:1.5px solid rgba(255,255,255,0.25);
      border-radius:12px; width:52px; height:52px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; color:#a8c0ff;
    }
    .icon-card-title { font-family:'Rajdhani',sans-serif; font-size:1.05rem; font-weight:700; color:#fff; }
    .icon-card-sub   { font-size:0.78rem; color:rgba(255,255,255,0.65); }
    .field-counter   { font-size:0.72rem; color:#8896b3; text-align:right; margin-top:2px; }
    .field-counter.warning { color:#f59e0b; }
    .field-counter.limit   { color:#ef4444; }
    .optional { color:#8896b3; font-weight:400; font-size:0.78rem; }
  </style>
</head>
<body>
<div class="page-wrapper">

  <header class="page-header">
    <button class="back-btn" onclick="window.location.href='visualizar-tipo-servicos.html'" title="Voltar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="page-title">Novo tipo de serviço</h1>
    <div class="header-spacer"></div>
  </header>

  <div class="icon-card">
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>
    <div>
      <div class="icon-card-title">Cadastro de Serviço</div>
      <div class="icon-card-sub">Preencha as informações do novo tipo de serviço</div>
    </div>
  </div>

  <div class="form-card">
    <div class="field-col">
      <label class="field-label-col" for="txf_nome_servico">Nome do serviço:</label>
      <input type="text" id="txf_nome_servico" class="field-input" style="width:100%;text-align:left;padding:10px 12px;"
             placeholder="Ex: Inspeção, Manutenção, Entrega..." maxlength="100" autocomplete="off"/>
      <span class="field-counter" id="counter_nome">0/100</span>
    </div>

    <div class="divider"></div>

    <div class="field-col">
      <label class="field-label-col" for="txf_descricao_servico">
        Descrição <span class="optional">(opcional)</span>:
      </label>
      <textarea id="txf_descricao_servico" class="field-textarea"
                placeholder="Descreva o tipo de serviço em detalhes..." rows="4" maxlength="500"></textarea>
      <span class="field-counter" id="counter_descricao">0/500</span>
    </div>
  </div>

  <div class="actions-row">
    <button class="btn btn-descartar" onclick="window.location.href='visualizar-tipo-servicos.html'">Descartar</button>
    <button class="btn btn-salvar" id="Btn_salvar_servico" onclick="salvarTipoServico()">Salvar</button>
  </div>

  <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><span>Salvando serviço...</span></div>
</div>

<script src="assets/scripts/global.js"></script>
<script src="assets/scripts/cadastrar-tipo-servico.js" defer></script>
</body>
</html>
