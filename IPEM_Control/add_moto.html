<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ipem</title>
    <link rel="stylesheet" href="assets/styles/addmoto.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <img src="assets/images/logo_ipem.png" alt="Logo Ipem" />
      </div>

      <button class="btn_menu">
        <img src="assets/images/icon_menu.png" alt="Menu" />
      </button>

      <nav class="nav">
        <ul class="menu">
          <li class="dropdown">
            <div class="dropdown-btn">
              Veículos <span class="arrow">▼</span>
            </div>
            <ul class="submenu">
              <li><a href="./add_veic.html">Novo Veículo</a></li>
              <li><a href="./ver_veiculos.html">Gerenciamento</a></li>
              <li><a href="./abastecimento.html">Abastecer</a></li>
            </ul>
          </li>

          <li class="dropdown">
            <div class="dropdown-btn">
              Motoristas <span class="arrow">▼</span>
            </div>
            <ul class="submenu">
              <li><a href="./add_moto.html">Novo Motorista</a></li>
              <li><a href="./ver_motoristas.html">Gerenciamento</a></li>
            </ul>
          </li>

          <li class="dropdown">
            <div class="dropdown-btn">
              Relatórios <span class="arrow">▼</span>
            </div>
            <ul class="submenu">
              <li><a href="#">Ver Relatórios</a></li>
            </ul>
          </li>
        </ul>

        <div class="nav_btn">
          <a href="#">
            <img src="assets/images/icon_perfil.png" alt="Perfil" />
          </a>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="header_titulo">
        <h2>Adicionar um Motorista</h2>
        <a href="tela_veiculos.html">
          <img src="assets/images/icons_cancel.png" alt="Cancelar" />
        </a>
      </div>

      <section class="card">
        <div class="card_body">
          <div class="card_titulo">
            <img src="assets/images/icon_perfil.png" alt="logo" />
            <h3>Preencha os dados:</h3>
          </div>

          <!-- Mensagem de erro/sucesso -->
          <div id="msg_formulario" style="display:none; padding:10px 20px; font-size:16px; border-radius:6px; margin:10px 20px 0;"></div>

          <form class="form" id="form_motorista">

            <!-- NOME -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_nome_add_motorista">Nome completo:</label>
                <input id="txf_nome_add_motorista" name="txf_nome_add_motorista" type="text" placeholder="Nome completo" />
              </div>
            </div>

            <!-- DATA NASCIMENTO -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_data_add_motorista">Data de Nascimento:</label>
                <input id="txf_data_add_motorista" name="txf_data_add_motorista" type="date" />
              </div>
            </div>

            <!-- CPF -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_cpf_add_motorista">CPF:</label>
                <input id="txf_cpf_add_motorista" name="txf_cpf_add_motorista" type="text" placeholder="Somente números" maxlength="11" />
              </div>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_email_add_motorista">E-mail:</label>
                <input id="txf_email_add_motorista" name="txf_email_add_motorista" type="email" placeholder="email@exemplo.com" />
              </div>
            </div>

            <!-- CARGO -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_cargo_add_motorista">Cargo:</label>
                <input id="txf_cargo_add_motorista" name="txf_cargo_add_motorista" type="text" placeholder="Ex: Técnico, Motorista..." />
              </div>
            </div>

            <!-- TIPO USUÁRIO -->
            <div class="form-group">
              <div class="linha">
                <label for="ddl_tipo_usuario_add_motorista">Tipo de acesso:</label>
                <select id="ddl_tipo_usuario_add_motorista" name="ddl_tipo_usuario_add_motorista">
                  <option value="tecnico">Técnico</option>
                  <option value="adm">Administrador</option>
                </select>
              </div>
            </div>

            <!-- HABILITAÇÃO (N. REGISTRO) -->
            <div class="form-group">
              <div class="linha">
                <label for="txf_registro_add_motorista">Habilitação (N. Registro):</label>
                <input id="txf_registro_add_motorista" name="txf_registro_add_motorista" type="text" placeholder="Número do registro" />
              </div>
            </div>

            <!-- CATEGORIA HABILITAÇÃO -->
            <div class="form-group">
              <div class="linha">
                <label for="ddl_carteira_add_motorista">Categoria CNH:</label>
                <select id="ddl_carteira_add_motorista" name="ddl_carteira_add_motorista">
                  <option value="">Selecione...</option>
                  <option value="B">B</option>
                  <option value="AB">AB</option>
                  <option value="C">C</option>
                  <option value="AC">AC</option>
                  <option value="D">D</option>
                  <option value="AD">AD</option>
                  <option value="E">E</option>
                  <option value="AE">AE</option>
                </select>
              </div>
            </div>

            <!-- SENHA -->
            <div class="form-group">
              <div class="linha">
                <label for="pwd_senha_add_motorista">Senha:</label>
                <input id="pwd_senha_add_motorista" name="pwd_senha_add_motorista" type="password" placeholder="Mínimo 6 caracteres" />
              </div>
            </div>

            <!-- CONFIRMAR SENHA -->
            <div class="form-group">
              <div class="linha">
                <label for="pwd_conf_senha_add_motorista">Confirme a senha:</label>
                <input id="pwd_conf_senha_add_motorista" name="pwd_conf_senha_add_motorista" type="password" placeholder="Repita a senha" />
              </div>
            </div>

            <div class="form-actions">
              <button id="btn_salvar_add_motorista" name="btn_salvar_add_motorista" type="submit" class="btn-save">Salvar</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="assets/scripts/addmoto.js"></script>
  </body>
</html>
