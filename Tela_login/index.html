<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/styles/style.css">

  <title>IPEM – Login</title>
</head>

<body>

  <main class="page">
    <section class="container">

      <div class="logo-wrap">
        <h1 class="logo-text">IPEM Control</h1>
      </div>

      <form class="card" id="loginForm">

        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" required autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" required autocomplete="current-password" />

            <button type="button" class="eye-btn" id="togglePassword" aria-label="Mostrar senha">
              <!-- UM ÚNICO SVG — JS troca o innerHTML -->
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>

        <div class="btn_centralizar">
          <button type="button" class="forgot" id="forgotBtn">
            Esqueceu a senha?
          </button>
        </div>

      </form>

    </section>
  </main>

  <script src="./assets/scripts/script.js"></script>

</body>
</html>
